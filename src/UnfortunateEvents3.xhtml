<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <script src="/kit.umd.js"></script>
    <script src="/event.js"></script>
    <script src="V/ue3.js" />
    <link href="UnfortunateEvents/unfortunate.css" rel="stylesheet" />
    <script>
      window.boiler = {
        title: 'Unfortunate Events Part III',
        author: 'Jess McGatha',
        copyright: '2023',
        abilities: {
          textInput: 'nearest',
          scratchPad: true,
        },
        reactiveBuilder: 'pageBody',
        lookup: {
          wordle: [
            'yxyxx',
            'yxyxx',
            'gxyxx',
            'xxxxy'
          ],
        },
      };
    </script>
    <style>
    </style>
  </head>
  <body id="Local">
    <div id="pageBody">
      <div class="quarter" id="top-left">
        <h2>EVENT: FEELING UNDER THE WEATHER</h2>
      </div>
      <div class="quarter" id="top-right">
        <h2>EVENT: FRIENDS CHANGE</h2>
      </div>
      <div class="quarter" id="bottom-left">
        <h2>EVENT: ENDLESS WORK</h2>
      </div>
      <div class="quarter" id="bottom-right">
        <h2>EVENT: RUNNING IN CIRCLES</h2>

      </div>
      <div id="wordle" data-input-style="grid">
        <for each="row" in="wordle" trim="all">
          <p id="wordle-{row#}">
            <if test="{row# % 2}" eq="{0}">
              <img class="left-edge-arrow" src="UnfortunateEvents/right-arrow.png" />
            </if>
            <for char="cell" in="row">
              <letter class="wordle-{cell}" />
            </for>
            <if test="{row# % 2}" eq="{1}">
              <img class="right-edge-arrow" src="UnfortunateEvents/left-arrow.png" />
            </if>
          </p>
        </for>
        <p class="bottom">
          <img src="UnfortunateEvents/down-arrow.png" /><br />
          ANSWER WORDLE
        </p>
      </div>

      <use template='finalAnswer' left="2in" width="3in" />

    </div>
  </body>
</html>
