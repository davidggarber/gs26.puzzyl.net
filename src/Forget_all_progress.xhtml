<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN"
"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <script src="/kit.umd.js"></script>
    <script src="/event.js"></script>
    <script>
      window.boiler = {
        noSync: true,
        title: 'Forget all progress',
        abilities: {
        },
        lookup: {
        }
      };

      function forgetAll() {
        var path = window.location.href;
        var i = path.lastIndexOf('/');
        path = path.substring(0, i);
        var count = forgetChildrenOf(path);
        showComplete(count);
        var backLink = backlinkFromUrl();
        if (backLink) {
          document.getElementById('back').setAttribute('href', backLink);
        }
        else {
          document.getElementById('back').style.display = 'none';
        }
      }

      function showComplete(count) {
        document.getElementById('button').setAttribute('disabled', true);
        document.getElementById('count').innerText = count;
        document.getElementById('confirmed').style.display = 'block';
      }
    </script>
    <style>
    </style>
  </head>
  <body id="Forget">
    <div id="pageBody">
      <p class="flavor">
        Click below to confirm reset of all saved progress, across all puzzles in this event.
      </p>
      <p><button id="button" onclick="forgetAll()">CONFIRM RESET</button></p>

      <div id="confirmed" style="display:none;">
        <p>COMPLETED. <span id="count"></span> items cleared.</p>
        <a id="back">Return to event</a>
      </div>

    </div>
  </body>
</html>
