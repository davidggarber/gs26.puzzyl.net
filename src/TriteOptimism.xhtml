            text-anchor: middle;

    </style>
  </head>
  <body id="Local">
    <div id="pageBody">
      <p id="flavor">
        Our <i>initial</i> morale budget was reduced to just $18.
        But don’t <i>despair</i>! I found a specialty online vendor 
        that can help. What do you think of these posters?
      </p>

      <svg id="svg" width="960" height="672" xmlns="http://www.w3.org/2000/svg">
        <for each="row" in="{posters}">
          <for each="poster" in="{row}">
            <g ttransform="translate({poster#*320},{row#*216})">
